[package]
name = "nana-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Rust-native UI foundation for the Nana application family"
license = "MIT OR Apache-2.0"

[lints]

[lib]
name = "nana_ui"
path = "src/lib.rs"

[features]

default = ["wgpu-backends"]
# Every WGPU backend the platform has (DX12/Vulkan/GLES on Windows, Metal on
# Apple, Vulkan/GLES on Linux). Only takes effect with `gpu`. An application
# that ships a narrower set turns default features off and enables the
# backends it wants on its own `wgpu` dependency.
wgpu-backends = ["wgpu?/dx12", "wgpu?/gles", "wgpu?/metal", "wgpu?/vulkan"]
full = ["bundled-fonts", "components", "hosted", "syntax-highlighting"]
bundled-fonts = ["nana-ui-core/bundled-fonts"]
# Compatibility flags must gate real code: every entry here either maps to a
# `cfg(feature = …)` component module or pulls a runtime feature. No-op aliases
# were removed — enable `components` / `full` instead.
components = [
    "calendar",
    "charts",
    "controls",
    "graph-canvas",
    "image-viewer",
    "rich-text",
]
calendar = ["nana-ui-runtime/calendar", "nana-ui-scene/calendar"]
charts = ["nana-ui-runtime/charts", "nana-ui-scene/charts"]
controls = ["nana-ui-runtime/controls", "nana-ui-scene/controls"]
syntax-highlighting = [
    "nana-ui-runtime/syntax-highlighting",
]
reactive-trace = ["nana-ui-runtime/reactive-trace"]
view-macro = ["nana-ui-runtime/view-macro"]
# AccessKit TreeUpdate projection for hosts that own their platform adapter
# wiring (e.g. Android via `accesskit_android`). Desktop `hosted` implies it.
accesskit-tree = ["dep:accesskit"]
graph-canvas = ["nana-ui-runtime/graph-canvas", "nana-ui-scene/graph-canvas"]
image-viewer = ["nana-ui-runtime/image-viewer", "nana-ui-scene/image-viewer"]
rich-text = ["nana-ui-runtime/rich-text", "nana-ui-scene/rich-text", "nana-ui-core/bundled-font-regular"]
# Full generated Tabler catalog as typed `Icon` constants. Off by default:
# the built-in catalog covers shell chrome only, and products that need
# product glyphs (user, keyboard, message, play …) should not have to
# hand-author `IconData`. Unreferenced constants are dropped by the linker.
icons-tabler = ["dep:nana-icons-tabler"]
# Issue #226: mount the package's `.nrpack` resource packs, read its package
# manifest, and answer `NANA_PACKAGE_VALIDATE` self-checks. Opt-in: embedded
# hosts that do their own packaging never link `nana-package`.
packaged-resources = ["dep:nana-package"]
gpu = ["dep:bytemuck", "dep:nana-frame-exchange", "dep:nana-gpu", "dep:base64", "dep:etagere", "dep:image", "dep:pollster", "dep:nana-svg-raster", "dep:swash", "nana-ui-platform/fetch", "dep:wgpu", "dep:windows"]
# Explicit escape hatch to the WGPU objects behind the GPU contract
# (`GpuContext::wgpu()`, `FrameContext::wgpu_encoder()`, `nana_ui::wgpu`, …).
# Hosts that bring their own device and renderers that record their own
# pipelines need it; ordinary HostTexture / FrameExchange use does not.
wgpu-interop = ["gpu", "nana-gpu/wgpu-interop", "nana-frame-exchange/wgpu-interop"]
hosted = [
    "gpu",
    "accesskit-tree",
    "dep:accesskit_macos",
    "dep:accesskit_unix",
    "dep:accesskit_windows",
    "dep:image",
    "dep:nana-app-icon",
    "dep:nana-window",
    "dep:raw-window-handle",
    "dep:winit",
    "dep:windows",
]

[dependencies]
accesskit = { version = "0.25.0", optional = true }
bytemuck = { version = "1.24", features = ["derive"], optional = true }
base64 = { version = "0.23", optional = true }
# Rectangle packing for the native glyph atlas (#97). NanaUI owns the atlas
# policy and lifetime; the shelf packer itself is not worth rewriting.
etagere = { version = "0.2.15", optional = true }
# Outline scaling and rasterization behind `scene_paint::text::raster` (#99).
# The renderer owns the rasterizer boundary; the outline rasterizer under it is
# not worth rewriting. On Windows DirectWrite takes outline glyphs and swash
# keeps color, bitmap and sideways ones (`raster_dwrite.rs`).
swash = { version = "0.2.10", optional = true }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"], optional = true }
pollster = { version = "1.0", optional = true }
nana-svg-raster = { git = "https://github.com/sena-nana/NanaUI.git", rev = "ee94106746b13f356af17586ed5e35ed78f9eb40", optional = true, features = ["system-fonts"] }
nana-frame-exchange = { git = "https://github.com/sena-nana/NanaUI.git", rev = "ee94106746b13f356af17586ed5e35ed78f9eb40", optional = true }
nana-gpu = { git = "https://github.com/sena-nana/NanaUI.git", rev = "ee94106746b13f356af17586ed5e35ed78f9eb40", optional = true }
nana-ui-core = { git = "https://github.com/sena-nana/NanaUI.git", rev = "ee94106746b13f356af17586ed5e35ed78f9eb40" }
nana-diagnostics = { git = "https://github.com/sena-nana/NanaUI.git", rev = "ee94106746b13f356af17586ed5e35ed78f9eb40" }
nana-package = { git = "https://github.com/sena-nana/NanaUI.git", rev = "ee94106746b13f356af17586ed5e35ed78f9eb40", optional = true }
nana-icons-tabler = { git = "https://github.com/sena-nana/NanaUI.git", rev = "ee94106746b13f356af17586ed5e35ed78f9eb40", optional = true }
nana-ui-runtime = { git = "https://github.com/sena-nana/NanaUI.git", rev = "ee94106746b13f356af17586ed5e35ed78f9eb40" }
# Issue #96: IME surrounding-text rules come from the editable text path.
nana-text = { git = "https://github.com/sena-nana/NanaUI.git", rev = "ee94106746b13f356af17586ed5e35ed78f9eb40" }
nana-ui-scene = { git = "https://github.com/sena-nana/NanaUI.git", rev = "ee94106746b13f356af17586ed5e35ed78f9eb40" }
nana-ui-platform = { git = "https://github.com/sena-nana/NanaUI.git", rev = "ee94106746b13f356af17586ed5e35ed78f9eb40", features = ["clipboard"] }
nana-window = { git = "https://github.com/sena-nana/NanaUI.git", rev = "ee94106746b13f356af17586ed5e35ed78f9eb40", optional = true }
raw-window-handle = { version = "0.6.2", optional = true }
nana-app-icon = { git = "https://github.com/sena-nana/NanaUI.git", rev = "ee94106746b13f356af17586ed5e35ed78f9eb40", optional = true, features = ["runtime"] }
unicode-segmentation = "1.13.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wgpu = { version = "30.0.0", default-features = false, features = ["std", "parking_lot", "wgsl"], optional = true }
winit = { git = "https://github.com/rust-windowing/winit", rev = "874a1e31f194d11313c1ac133b28037b99db3e19", default-features = false, features = ["x11", "wayland", "wayland-dlopen"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
accesskit_macos = { version = "0.27.0", optional = true }

[dev-dependencies]
pollster = "1.0"

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
accesskit_unix = { version = "0.23.0", default-features = false, features = ["async-io"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
accesskit_windows = { version = "0.35.0", optional = true }
# `gpu`: DirectWrite glyph rasterization and the system's ClearType settings
# (`scene_paint/text/raster_dwrite.rs`). `hosted`: DirectComposition.
windows = { version = "0.62", optional = true, features = ["Win32_Foundation", "Win32_Graphics_DirectComposition", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi", "Win32_UI_WindowsAndMessaging"] }

