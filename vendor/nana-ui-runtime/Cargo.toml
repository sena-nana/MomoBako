# 桃箱产品构建用的 nana-ui-runtime 副本。
# 基线是 Nana Git 修订 ee94106746b13f356af17586ed5e35ed78f9eb40。
# 相对该修订：RichSpan 增加语义色，SelectableRichText 把带色片段投进已有 overlay；
# 弹性布局和放置遇到不定宽换行时把非有限尺寸收成 0；虚拟网格首帧没有宽度时仍按一列挂行。
# 同仓库的 nana-ui-core / nana-ui-scene 仍走 Git 修订，不在这份副本里。
[package]
name = "nana-ui-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Backend-neutral retained runtime for NanaUI"
license = "MIT OR Apache-2.0"

[features]
calendar = []
charts = []
controls = []
graph-canvas = []
image-viewer = []
rich-text = ["dep:pulldown-cmark", "dep:mermaid-svg", "dep:ratex-parser", "dep:ratex-layout", "dep:ratex-svg", "dep:ratex-types"]
components = ["calendar", "charts", "controls", "graph-canvas", "image-viewer", "rich-text"]
default = []
benchmark = []
# Records the reactive causal chain into a preallocated ring for "why did this update".
reactive-trace = []
# The `view!` template macro over the view layer (a separate proc-macro crate).
view-macro = ["dep:nana-ui-view-macros"]
syntax-highlighting = ["dep:two-face"]

[dependencies]
fancy-regex = "0.16.2"
hashbrown = "0.16.1"
nana-ui-view-schema = { git = "https://github.com/sena-nana/NanaUI.git", rev = "ee94106746b13f356af17586ed5e35ed78f9eb40" }
futures-core = "0.3.31"
nana-ui-core = { git = "https://github.com/sena-nana/NanaUI.git", rev = "ee94106746b13f356af17586ed5e35ed78f9eb40" }
nana-diagnostics = { git = "https://github.com/sena-nana/NanaUI.git", rev = "ee94106746b13f356af17586ed5e35ed78f9eb40" }
# Canonical input and the host services contract. Input routing, focus and IME
# state are Runtime responsibilities; the contract crate has no platform deps.
nana-ui-input = { git = "https://github.com/sena-nana/NanaUI.git", rev = "ee94106746b13f356af17586ed5e35ed78f9eb40" }
# Issue #95: the retained text node resolves through `nana-text`'s engine and
# keeps its layouts behind `nana-text` handles.
nana-text = { git = "https://github.com/sena-nana/NanaUI.git", rev = "ee94106746b13f356af17586ed5e35ed78f9eb40" }
nana-ui-view-macros = { git = "https://github.com/sena-nana/NanaUI.git", rev = "ee94106746b13f356af17586ed5e35ed78f9eb40", optional = true }
mermaid-svg = { version = "=0.7.0", optional = true }
ratex-parser = { version = "=0.1.14", optional = true }
ratex-layout = { version = "=0.1.14", optional = true }
ratex-svg = { version = "=0.1.14", features = ["embed-fonts"], optional = true }
ratex-types = { version = "=0.1.14", optional = true }
pulldown-cmark = { version = "0.13.4", default-features = false, optional = true }
qrcode = { version = "0.14.1", default-features = false }
unicode-segmentation = "1.13.0"
unicode-width = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
two-face = { version = "0.5", default-features = false, features = ["syntect-default-fancy"], optional = true }

# 独立工作区根，避免被桃箱工作区当成未登记成员。产品构建仍通过根 Cargo.toml 的 [patch] 引用本目录。
[workspace]

[[bin]]
name = "nana-runtime-benchmark"
path = "src/bin/nana-runtime-benchmark.rs"
required-features = ["benchmark"]

[[bin]]
name = "nana-framework-benchmark"
path = "src/bin/nana-framework-benchmark.rs"
required-features = ["benchmark"]

[[bin]]
name = "nana-reactive-benchmark"
path = "src/bin/nana-reactive-benchmark.rs"
required-features = ["benchmark"]

[[bin]]
name = "nana-theme-benchmark"
path = "src/bin/nana-theme-benchmark.rs"
required-features = ["benchmark"]
