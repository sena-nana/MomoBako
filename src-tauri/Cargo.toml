[package]
name = "momobako"
version = "0.1.0"
description = "MomoBako desktop application"
authors = ["MomoBako contributors"]
edition = "2021"

[lib]
name = "momobako_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "image-png", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-drag = "2.1.1"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.39", features = ["bundled"] }
time = { version = "0.3", features = ["formatting", "macros"] }
notify = "8.2"
tiny_http = "0.12"
image = "0.25"
ffmpeg-sidecar = "2.5.2"
sha2 = "0.11"
sha1 = "0.10"
hex = "0.4"
getrandom = "0.3"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
jwalk = "0.8.1"
mutsuki-runtime-contracts = { git = "https://github.com/sena-nana/Mutsuki.git", rev = "e8b86a14e2433461525d2a052b499fde488102a9" }
mutsuki-plugin-api = { git = "https://github.com/sena-nana/Mutsuki.git", rev = "e8b86a14e2433461525d2a052b499fde488102a9" }
mutsuki-plugin-host = { git = "https://github.com/sena-nana/Mutsuki.git", rev = "e8b86a14e2433461525d2a052b499fde488102a9" }
tokio = { version = "1", features = ["rt", "sync"] }
toml = "0.8"

[dev-dependencies]
mutsuki-runtime-wire = { git = "https://github.com/sena-nana/Mutsuki.git", rev = "e8b86a14e2433461525d2a052b499fde488102a9" }

[target.'cfg(windows)'.dependencies]
everything-ipc = "0.1.3"
ntfs-reader = "0.4.5"
