[package]
name = "momobako_source_eagle_library"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
momobako_mutsuki_plugin_sdk = { path = "../_sdk/mutsuki-rust" }
momobako_lib = { package = "momobako", path = "../../../src-tauri" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting"] }
