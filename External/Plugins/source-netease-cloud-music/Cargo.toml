[package]
name = "momobako_source_netease_cloud_music"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
momobako_mutsuki_plugin_sdk = { path = "../_sdk/mutsuki-rust" }
base64 = "0.22"
ncm-api-rs = { git = "https://github.com/SPlayer-Dev/ncm-api-rs.git" }
qrcode = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
