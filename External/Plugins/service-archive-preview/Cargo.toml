[package]
name = "momobako_service_archive_preview"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[lib]
crate-type = ["cdylib"]

[dependencies]
momobako_mutsuki_plugin_sdk = { path = "../_sdk/mutsuki-rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
time = { version = "0.3", features = ["formatting", "macros"] }
unarc-rs = "0.6.1"

[dev-dependencies]
zip = { version = "8.6", default-features = false, features = ["deflate"] }
