<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>MomoBako</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main>
      <label>
        Base URL
        <input id="baseUrl" placeholder="http://127.0.0.1:12345/external/v1">
      </label>
      <label>
        Token
        <input id="token" type="password">
      </label>
      <label>
        Repository ID
        <input id="repoId">
      </label>
      <label>
        Parent Path
        <input id="parentPath" placeholder="">
      </label>
      <div class="actions">
        <button id="save">Save</button>
        <button id="loadRepos">Load Repositories</button>
      </div>
      <select id="repositories"></select>
      <p id="status"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
