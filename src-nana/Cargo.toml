[package]
name = "momobako-nana"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "time", "net"] }
serde_json = "1"
sha2 = "0.10"
image = "0.25"
flate2 = "1.1.9"
# 只开 mp3、flac、ogg/vorbis。关掉默认的 wav/mkv，WAV 仍走自有解析。
symphonia = { version = "0.6.1", default-features = false, features = ["mp3", "flac", "ogg", "vorbis"] }
zip = { version = "8.6", default-features = false, features = ["deflate"] }
unarc-rs = "0.6.1"
momobako-backend = { path = "../src-backend" }
nana-ui = { git = "https://github.com/sena-nana/NanaUI.git", rev = "ee94106746b13f356af17586ed5e35ed78f9eb40", features = ["hosted", "bundled-fonts", "components", "icons-tabler"] }
nana-ui-core = { git = "https://github.com/sena-nana/NanaUI.git", rev = "ee94106746b13f356af17586ed5e35ed78f9eb40" }
nana-ui-platform = { git = "https://github.com/sena-nana/NanaUI.git", rev = "ee94106746b13f356af17586ed5e35ed78f9eb40", features = ["clipboard"] }

[dev-dependencies]
nana-ui-devtools = { git = "https://github.com/sena-nana/NanaUI.git", rev = "ee94106746b13f356af17586ed5e35ed78f9eb40", features = ["runtime-agent"] }

[[bin]]
name = "momobako-nana"
path = "src/main.rs"
