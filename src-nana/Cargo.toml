[package]
name = "momobako-nana"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "time", "net"] }
serde_json = "1"
sha2 = "0.10"
image = "0.25"
flate2 = "1.1.9"
# 只开 mp3、flac、ogg/vorbis。关掉默认的 wav/mkv，WAV 仍走自有解析。
symphonia = { version = "0.6.1", default-features = false, features = ["mp3", "flac", "ogg", "vorbis"] }
zip = { version = "8.6", default-features = false, features = ["deflate"] }
unarc-rs = "0.6.1"
momobako-backend = { path = "../src-backend" }
# view-macro：结构块容器的 `css!` 和 `#[derive(Store)]`，绑定式视图要用。
nana-ui = { git = "https://github.com/sena-nana/NanaUI.git", rev = "c6dc1086bb1b21406ee5e20a40ac6207c664913b", features = ["hosted", "bundled-fonts", "components", "icons-tabler", "view-macro"] }
nana-ui-core = { git = "https://github.com/sena-nana/NanaUI.git", rev = "c6dc1086bb1b21406ee5e20a40ac6207c664913b" }
nana-ui-platform = { git = "https://github.com/sena-nana/NanaUI.git", rev = "c6dc1086bb1b21406ee5e20a40ac6207c664913b", features = ["clipboard"] }

[target.'cfg(windows)'.dependencies]
# 与 Tauri `plugin:drag` 同一实现，把绝对路径拖出窗口。
drag = "2.1.1"
# 与 Tauri 托盘同一套 Win32 通知图标。
tray-icon = { version = "0.21.3", default-features = false }
raw-window-handle = "0.6.2"
# 系统媒体传输控件。测试构建不调用注册函数。
windows = { version = "0.62", features = ["Foundation", "Media", "Storage_Streams", "Win32_Foundation", "Win32_System_Com", "Win32_System_WinRT", "Win32_UI_Shell", "Win32_Media_MediaFoundation"] }

[dev-dependencies]
nana-ui-devtools = { git = "https://github.com/sena-nana/NanaUI.git", rev = "c6dc1086bb1b21406ee5e20a40ac6207c664913b", features = ["runtime-agent"] }

[[bin]]
name = "momobako-nana"
path = "src/main.rs"
