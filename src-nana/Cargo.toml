[package]
name = "momobako-nana"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "time", "net"] }
serde_json = "1"
image = "0.25"
flate2 = "1.1.9"
# 只开 mp3、flac、ogg/vorbis。关掉默认的 wav/mkv，WAV 仍走自有解析。
symphonia = { version = "0.6.1", default-features = false, features = ["mp3", "flac", "ogg", "vorbis"] }
zip = { version = "8.6", default-features = false, features = ["deflate"] }
unarc-rs = "0.6.1"
momobako-backend = { path = "../src-backend" }
# view-macro：结构块容器的 `css!` 和 `#[derive(Store)]`，绑定式视图要用。
# packaged-resources：启动时读发布包的 manifest，并回答 `nana-packager validate --run` 的自检。
nana-ui = { git = "https://github.com/sena-nana/NanaUI.git", rev = "bf35e6e64924533a292938258dafbd42966d18a3", features = ["hosted", "bundled-fonts", "components", "icons-tabler", "view-macro", "packaged-resources"] }
nana-ui-core = { git = "https://github.com/sena-nana/NanaUI.git", rev = "bf35e6e64924533a292938258dafbd42966d18a3" }
nana-ui-platform = { git = "https://github.com/sena-nana/NanaUI.git", rev = "bf35e6e64924533a292938258dafbd42966d18a3", features = ["clipboard"] }
# 预览里的 SVG 用 NanaUI 已经带着的 resvg 光栅（和 NanaUI 画 SVG 图片同一份），不另引第三方库。
nana-svg-raster = { git = "https://github.com/sena-nana/NanaUI.git", rev = "bf35e6e64924533a292938258dafbd42966d18a3" }

[target.'cfg(windows)'.dependencies]
# 把库内文件按绝对路径拖出窗口（Windows 复制拖放 DoDragDrop）。
drag = "2.1.1"
raw-window-handle = "0.6.2"
# 系统媒体传输控件（测试构建不调用注册函数）、Media Foundation 视频解码和 ShellExecuteW 外部打开。
# StructuredStorage 和 Variant 给源读取器的 PROPVARIANT 用：解码停在半路时读容器写的全长。
windows = { version = "0.62", features = ["Foundation", "Media", "Storage_Streams", "Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_WinRT", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Media_MediaFoundation"] }

[build-dependencies]
# 把图标和版本信息编进 Windows 可执行文件，见 build.rs。
embed-resource = "3.0.11"

[features]
# 离屏验收场景、验收文档和组件能力锁。只给测试用：单元测试按 cfg(test) 编进来，集成测试经下面的自依赖打开，
# 发布构建不带这些夹具。
acceptance = []

[dev-dependencies]
# 离屏验收给证据文件算哈希。
sha2 = "0.10"
momobako-nana = { path = ".", features = ["acceptance"] }
nana-ui-devtools = { git = "https://github.com/sena-nana/NanaUI.git", rev = "bf35e6e64924533a292938258dafbd42966d18a3", features = ["runtime-agent"] }

[[bin]]
name = "momobako-nana"
path = "src/main.rs"
