[package]
name = "momobako_builtin_local_filesystem"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
momobako_backend_plugin_sdk = { path = "../../backend-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "macros"] }
