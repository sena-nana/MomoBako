name: Publish Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 要发布的 tag，例如 v0.1.0。
        required: true
        type: string
      ref:
        description: 要发布的 branch、tag 或 commit。留空时使用 tag。
        required: false
        type: string

permissions:
  contents: write

env:
  # 发布流程同样从缓存快照冷编译，关闭增量编译，避免增量产物进 target 缓存。
  CARGO_INCREMENTAL: 0

jobs:
  publish-windows:
    name: Verify and publish Windows bundle
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Resolve ref
        id: release_ref
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.tag }}"
            $ref = "${{ inputs.ref }}"
          } else {
            $ref = $tag
          }
          if (-not $ref) {
            $ref = $tag
          }
          if (-not $tag) {
            throw "Release tag is required."
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          if ($ref) {
            "ref=$ref" >> $env:GITHUB_OUTPUT
          }

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release_ref.outputs.ref || github.ref }}

      - name: Set up Node.js and Yarn
        uses: sena-nana/LiliaUI/.github/actions/setup-node-yarn@8cdf9fce6f86b903a475ac852bce0627f237baf5

      - name: Set up Rust
        id: toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ steps.toolchain.outputs.cachekey }}-

      - name: Install external plugin dependencies
        working-directory: External/Plugins
        run: corepack yarn install --immutable

      - name: Verify MomoBako
        run: corepack yarn verify

      - name: Build external plugins
        working-directory: External/Plugins
        run: corepack yarn build

      - name: Package external plugins
        working-directory: External/Plugins
        run: corepack yarn package

      - name: Build and publish Windows bundle
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tauriScript: corepack yarn tauri
          tagName: ${{ steps.release_ref.outputs.tag }}
          releaseName: MomoBako ${{ steps.release_ref.outputs.tag }}
          releaseDraft: true
          generateReleaseNotes: true

      - name: Upload external plugin packages
        uses: actions/upload-artifact@v4
        with:
          name: external-plugin-packages
          path: External/Plugins/.packages/*.momoplug
