name: Publish Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 要发布的 tag，例如 v0.1.0。
        required: true
        type: string
      ref:
        description: 要发布的 branch、tag 或 commit。留空时使用 tag。
        required: false
        type: string

permissions:
  contents: write

env:
  # 发布流程同样从缓存快照冷编译，关闭增量编译，避免增量产物进 target 缓存。
  CARGO_INCREMENTAL: 0

jobs:
  publish-windows:
    name: Package and publish Windows release
    runs-on: windows-latest
    # dist 配置开了 fat LTO、单代码生成单元，本机 16 核冷编译主程序 35 分钟；加上插件发布构建和 nana-packager
    # 冷编译，4 核的托管机比原来的 Tauri 打包慢得多。
    timeout-minutes: 180

    steps:
      - name: Resolve ref
        id: release_ref
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.tag }}"
            $ref = "${{ inputs.ref }}"
          } else {
            $ref = $tag
          }
          if (-not $ref) {
            $ref = $tag
          }
          if (-not $tag) {
            throw "Release tag is required."
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          if ($ref) {
            "ref=$ref" >> $env:GITHUB_OUTPUT
          }

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release_ref.outputs.ref || github.ref }}

      - name: Set up Node.js and Yarn
        uses: sena-nana/LiliaUI/.github/actions/setup-node-yarn@8cdf9fce6f86b903a475ac852bce0627f237baf5

      - name: Set up Rust
        id: toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ steps.toolchain.outputs.cachekey }}-

      - name: Install external plugin dependencies
        working-directory: External/Plugins
        run: corepack yarn install --immutable

      - name: Test backend
        run: corepack yarn test:backend

      - name: Build external plugins
        working-directory: External/Plugins
        run: corepack yarn build

      - name: Package external plugins
        working-directory: External/Plugins
        run: corepack yarn package

      - name: Build MomoBako
        run: corepack yarn nana:build

      # nana-packager 按 src-nana/Cargo.toml 固定的 NanaUI 修订装进 target/nana-packager；打安装版布局和便携版，
      # 各自 validate，便携版的 zip 解开后再跑 validate --run --tamper-suite。
      - name: Package and validate MomoBako
        run: corepack yarn nana:package --out "${{ runner.temp }}/nana-package" --expect-tag "${{ steps.release_ref.outputs.tag }}"

      - name: Publish draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release_ref.outputs.tag }}
          PACKAGE_DIR: ${{ runner.temp }}/nana-package
        run: |
          $assets = @(Get-ChildItem -LiteralPath $env:PACKAGE_DIR -Filter "MomoBako_*.zip" | ForEach-Object { $_.FullName })
          if ($assets.Count -ne 2) {
            throw "Expected the installer and portable archives, found $($assets.Count)."
          }
          $notes = "Windows x64。MomoBako_*_portable.zip 是便携版，数据在解压目录的 data 下；另一个 zip 解压到任意位置运行，数据在 %APPDATA%\com.momobako.desktop。"
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG @assets --clobber
          } else {
            $target = git rev-parse HEAD
            gh release create $env:RELEASE_TAG @assets --draft --title "MomoBako $env:RELEASE_TAG" --notes $notes --generate-notes --target $target
          }
          if ($LASTEXITCODE -ne 0) {
            throw "Publishing the draft release failed."
          }

      - name: Upload external plugin packages
        uses: actions/upload-artifact@v4
        with:
          name: external-plugin-packages
          path: External/Plugins/.packages/*.momoplug
