name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI 每次都从缓存快照冷编译工作区 crate，增量产物用不上，只会撑大 target 缓存。
  CARGO_INCREMENTAL: 0

jobs:
  verify-momobako:
    name: Verify MomoBako
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js and Yarn
        uses: sena-nana/LiliaUI/.github/actions/setup-node-yarn@8cdf9fce6f86b903a475ac852bce0627f237baf5

      - name: Set up Rust
        id: toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ steps.toolchain.outputs.cachekey }}-

      - name: Test backend
        run: corepack yarn test:backend

      - name: Verify MomoBako
        run: corepack yarn verify

  build-external-plugins:
    name: Build External Plugins and Nana package inputs
    runs-on: windows-latest
    # Nana dist 冷编译和插件构建都可能较慢；dry-run 不下载 packager、不启动进程。
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js and Yarn
        uses: sena-nana/LiliaUI/.github/actions/setup-node-yarn@8cdf9fce6f86b903a475ac852bce0627f237baf5
        with:
          working-directory: External/Plugins

      - name: Set up Rust
        id: toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-external-plugins-cargo-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-external-plugins-cargo-${{ steps.toolchain.outputs.cachekey }}-

      - name: Build external plugins
        working-directory: External/Plugins
        run: corepack yarn build

      - name: Package external plugins
        working-directory: External/Plugins
        run: corepack yarn package

      - name: Build Nana dist executable
        run: corepack yarn nana:build

      - name: Validate Nana package inputs
        # 真实 exe + .momoplug envelope/triple + installer/portable 配置均走一遍；
        # 完整 nana:package 仍留在 release workflow 执行。
        run: corepack yarn nana:package --dry-run

  build-docs:
    name: Build docs
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js and Yarn
        uses: sena-nana/LiliaUI/.github/actions/setup-node-yarn@8cdf9fce6f86b903a475ac852bce0627f237baf5

      - name: Build docs
        run: corepack yarn docs:build
