name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-momobako:
    name: Verify MomoBako
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack yarn install --immutable

      - name: Verify MomoBako
        run: corepack yarn verify

  build-external-plugins:
    name: Build External Plugins
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
            External/Plugins/local-filesystem/target
          key: ${{ runner.os }}-external-plugins-cargo-${{ hashFiles('src-tauri/Cargo.lock', 'External/Plugins/local-filesystem/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-external-plugins-cargo-

      - name: Enable Corepack
        run: corepack enable

      - name: Install host dependencies
        run: corepack yarn install --immutable

      - name: Install external plugin dependencies
        working-directory: External/Plugins
        run: corepack yarn install --immutable

      - name: Build external plugins
        working-directory: External/Plugins
        run: corepack yarn build

      - name: Package external plugins
        working-directory: External/Plugins
        run: corepack yarn package

  build-docs:
    name: Build docs
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack yarn install --immutable

      - name: Build docs
        run: corepack yarn docs:build
