<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MomoBako</title>
    <script>
      try {
        var t = localStorage.getItem("momobako.theme");
        if (t !== "light" && t !== "dark") {
          t = localStorage.getItem("tauri-template.theme");
          if (t === "light" || t === "dark") {
            localStorage.setItem("momobako.theme", t);
          }
        }
        if (t === "light" || t === "dark") {
          document.documentElement.dataset.theme = t;
        }
      } catch (e) {}
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
