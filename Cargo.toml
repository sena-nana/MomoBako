[workspace]
resolver = "2"
members = [
  "src-backend",
  "src-nana",
  "External/Plugins/_sdk/mutsuki-rust",
  "External/Plugins/local-filesystem",
  "External/Plugins/office-convert",
  "External/Plugins/office-convert/helper",
  "External/Plugins/parser-asmr-folder",
  "External/Plugins/parser-netease-cloud-music",
  "External/Plugins/service-archive-preview",
  "External/Plugins/service-downloader",
  "External/Plugins/service-provider-asmr-one",
  "External/Plugins/service-provider-dlsite",
  "External/Plugins/source-eagle-library",
  "External/Plugins/source-netease-cloud-music",
]
exclude = [
  "External/Plugins/example/backend-rust",
  "External/Plugins/template/backend-rust",
]

# 发布包用的配置，照 NanaUI 打包合同的 dist：在 release 上开 fat LTO、单代码生成单元、去掉符号。
# 和 NanaUI 不同的是保留 panic = "unwind"：宿主的任务守卫和缩略图解码要在任务里接住 panic、按失败交回，
# 改成 abort 时一次 panic 就会结束整个进程。插件照旧用 release 编。
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"
